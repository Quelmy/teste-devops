version: '3.9'

services:
  api:
    build:
      context: .
      target: builder          # Use builder stage for dev (includes devDeps)
    image: lacrei-api:dev
    container_name: lacrei-api-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_VERSION: dev
      ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:5173'
    volumes:
      - ./src:/app/src          # Hot-reload via nodemon
    command: ['node', 'src/server.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
