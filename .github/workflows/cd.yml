name: CD – Deploy Staging & Production

on:
  push:
    branches: [main]         # → deploy automático para staging
    tags: ['v*.*.*']         # → deploy para produção (com aprovação)

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: lacrei-api

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 – Build & push para ECR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-uri: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Run Trivy on pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # Job 2 – Deploy para Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition-staging.json
          container-name: lacrei-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          environment-variables: |
            NODE_ENV=staging
            APP_VERSION=${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS Staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: lacrei-service-staging
          cluster: lacrei-staging
          wait-for-service-stability: true
          wait-for-minutes: 10

  # ─────────────────────────────────────────────────────────────
  # Job 3 – Smoke test no Staging
  # ─────────────────────────────────────────────────────────────
  smoke-test:
    name: 💨 Smoke Test – Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Wait for ALB to propagate
        run: sleep 30

      - name: Health check /health
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ /health returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ /health → HTTP 200"

  # ─────────────────────────────────────────────────────────────
  # Job 4 – Deploy para Produção (somente em tags v*.*.*)
  #         Requer aprovação manual via GitHub Environments
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: 🏁 Deploy → Production
    runs-on: ubuntu-latest
    needs: [smoke-test, build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def-prod
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition-prod.json
          container-name: lacrei-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          environment-variables: |
            NODE_ENV=production
            APP_VERSION=${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-prod.outputs.task-definition }}
          service: lacrei-service-prod
          cluster: lacrei-prod
          wait-for-service-stability: true
          wait-for-minutes: 15

  # ─────────────────────────────────────────────────────────────
  # Job 5 – Notificação de resultado (Bônus: Slack)
  # ─────────────────────────────────────────────────────────────
  notify:
    name: 📢 Notify Slack
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, smoke-test]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "msg=Deploy concluído com sucesso" >> $GITHUB_OUTPUT
          else
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "msg=Falha no pipeline de deploy" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "title": "${{ steps.status.outputs.emoji }} Lacrei Saúde – ${{ steps.status.outputs.msg }}",
                  "fields": [
                    { "title": "Repositório", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch/Tag", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true }
                  ],
                  "footer": "GitHub Actions",
                  "ts": "${{ github.event.head_commit.timestamp }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
